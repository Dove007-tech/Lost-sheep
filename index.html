<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lost Sheep — 365 Day Catholic Tracker</title>
    <style>
        :root {
            --pasture-green: #dcedc8;
            --path-green: #9ccc65;
            --shepherd-blue: #1e88e5;
            --text-main: #2e7d32;
            --gold: #ffb300;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--pasture-green);
            color: #1b5e20;
            background-image: radial-gradient(#c5e1a5 20%, transparent 20%);
            background-size: 30px 30px;
        }

        .main-wrapper {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        @media (max-width: 950px) {
            .main-wrapper { grid-template-columns: 1fr; }
        }

        .center-trail, .side-devotion {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Shepherd Banner Card */
        .shepherd-banner {
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            border: 4px solid var(--path-green);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            position: relative;
        }

        .banner-icon { font-size: 4.5rem; display: block; margin-bottom: 5px; }
        .banner-heading { font-weight: 900; font-size: 1.7rem; color: #1b5e20; margin: 0 0 5px 0; }
        .banner-scripture { font-style: italic; color: #558b2f; margin: 0; font-size: 1.05rem; }

        /* Multi-Profile Track selector bar */
        .profile-bar {
            background: rgba(255,255,255,0.9);
            padding: 12px 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #fff;
        }
        .profile-bar select {
            padding: 6px 12px;
            border-radius: 8px;
            border: 2px solid var(--path-green);
            font-weight: bold;
            color: #1b5e20;
            outline: none;
        }

        /* Solid Hills Path Grid wrapper */
        .hill-trail-viewport {
            background: var(--path-green);
            border-radius: 24px;
            padding: 20px;
            border: 4px solid #ffffff;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.08);
            max-height: 500px;
            overflow-y: auto;
        }

        /* 10 columns compact path layout tracking matrix layout */
        .grid-meadow {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        @media (max-width: 650px) { .grid-meadow { grid-template-columns: repeat(5, 1fr); } }

        .sheep-box {
            background: #ffffff;
            border-radius: 10px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            font-size: 0.65rem;
            text-align: center;
            position: relative;
            border: 1px solid #c5e1a5;
            min-height: 62px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .sheep-box.pastured {
            background: #e8f5e9 !important;
            border-color: #a5d6a7 !important;
        }

        .sheep-box.active-seek {
            border: 2.5px solid var(--shepherd-blue) !important;
            background: #e3f2fd;
            transform: scale(1.04);
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .box-title { font-weight: 800; color: #33691e; font-size: 0.7rem; }
        .box-chapters { color: #555; font-size: 0.48rem; line-height: 1.1; margin-top: 1px; }
        
        .sheep-token {
            font-size: 1.25rem;
            position: absolute;
            bottom: 2px;
            animation: bounce 0.4s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-3px); }
        }

        /* Action Buttons Row Configuration layout alignment */
        .action-row {
            display: flex;
            gap: 15px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 16px;
            border: 2px solid #fff;
            justify-content: center;
        }

        .tracker-btn {
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tracker-btn:active { transform: scale(0.98); }
        .btn-seek { background-color: var(--shepherd-blue); color: white; flex: 2; max-width: 280px; box-shadow: 0 4px 12px rgba(30,136,229,0.3); }
        .btn-seek:hover { background-color: #1565c0; }
        .btn-restart { background-color: #e53935; color: white; flex: 1; max-width: 120px; }

        /* Devotional Sidebars styles options cards alignment text box fields */
        .devotional-sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 24px;
            border: 2px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            height: fit-content;
        }

        .bible-portal-box {
            background: #f1f8e9;
            border: 2px solid var(--path-green);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .portal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(21,101,192,0.25);
        }

        .notes-field {
            width: 100%;
            height: 140px;
            border: 2px solid #c8e6c9;
            border-radius: 12px;
            padding: 12px;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
            background: #fffdf9;
            font-size: 0.95rem;
            outline: none;
        }

        .verse-banner-footer {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            font-style: italic;
            border: 2px solid #ffcdd2;
            color: #33691e;
        }

        /* OFFLINE FIXED PARALLAX BALLOON OVERLAY BANNER ASSEMBLY */
        .victory-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 20000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .victory-card {
            background: white;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.12);
            border: 5px solid var(--gold);
            max-width: 500px;
            text-align: center;
            z-index: 20002;
        }
        .float-balloon-field { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 20001; }
        .air-balloon { position: absolute; bottom: -100px; font-size: 3.5rem; animation: liftUp 6s linear infinite; }
        @keyframes liftUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(15deg); opacity: 0; }
        }

        .hill-trail-viewport::-webkit-scrollbar { width: 6px; }
        .hill-trail-viewport::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); border-radius: 10px; }
        .hill-trail-viewport::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- HILL MEADOW CENTER COLUMN TRAIL SYSTEM -->
        <div class="center-trail">
            
            <div class="shepherd-banner">
                <span class="banner-icon">🙌🧔🐑</span>
                <h1 class="banner-heading">The Lost Sheep Trail</h1>
                <p class="banner-scripture">"What man among you having a hundred sheep and losing one of them would not leave the ninety-nine in the desert and go after the lost one until he finds it?" — Luke 15:4</p>
            </div>

            <!-- Profile selector header layout segment line asset -->
            <div class="profile-bar">
                <strong>👤 Pilgrim Profile:</strong>
                <select id="profileDropdown" onchange="changeProfileTrack()">
                    <option value="Profile1">My Devotion Journey</option>
                    <option value="Profile2">Family Reading Plan</option>
                    <option value="Profile3">Parish Study Group</option>
                </select>
                <small style="color:#666; font-style:italic;">(Saves progress separately)</small>
            </div>

            <div class="hill-trail-viewport">
                <div class="grid-meadow" id="meadowGridNode">
                    <!-- Loaded dynamically via the standalone script logic down below -->
                </div>
            </div>

            <div class="action-row">
